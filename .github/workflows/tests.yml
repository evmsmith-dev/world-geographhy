# Runs the game's automatic checks (the tests folder) on every pull request and every change to main,
# and publishes the game to GitHub Pages only after every check on main has passed.
# A green check on the pull request means they all passed; a red X means something broke. Click "Details" to see what.
# For publishing to work, Settings → Pages → Source must be set to "GitHub Actions".
name: Tests and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# only one publish at a time; a newer change on main replaces one that is still waiting
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests run as twelve jobs side by side, so the whole check takes about three minutes instead of fifteen or more:
  # the quick data checks; then for the phone and the iPad, "tap every place" (one test per topic) shared out three ways
  # with Playwright's --shard, and everything else two ways (phone) or three (iPad, which is slower).
  # (A data check in tests/data.spec.js makes sure each group's shards cover all of it.)
  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # finish every job, so one failure doesn't hide another
      matrix:
        include:
          - name: phone, tap every place 1 of 3
            browser: chromium
            args: --project=phone tap-everything --shard=1/3
          - name: phone, tap every place 2 of 3
            browser: chromium
            args: --project=phone tap-everything --shard=2/3
          - name: phone, tap every place 3 of 3
            browser: chromium
            args: --project=phone tap-everything --shard=3/3
          - name: iPad, tap every place 1 of 3
            browser: webkit
            args: --project=ipad tap-everything --shard=1/3
          - name: iPad, tap every place 2 of 3
            browser: webkit
            args: --project=ipad tap-everything --shard=2/3
          - name: iPad, tap every place 3 of 3
            browser: webkit
            args: --project=ipad tap-everything --shard=3/3
          - name: data checks
            browser: chromium
            args: --project=data
          - name: phone, everything else 1 of 2
            browser: chromium
            args: --project=phone --grep-invert "every place can be tapped" --shard=1/2
          - name: phone, everything else 2 of 2
            browser: chromium
            args: --project=phone --grep-invert "every place can be tapped" --shard=2/2
          - name: iPad, everything else 1 of 3
            browser: webkit
            args: --project=ipad --grep-invert "every place can be tapped" --shard=1/3
          - name: iPad, everything else 2 of 3
            browser: webkit
            args: --project=ipad --grep-invert "every place can be tapped" --shard=2/3
          - name: iPad, everything else 3 of 3
            browser: webkit
            args: --project=ipad --grep-invert "every place can be tapped" --shard=3/3
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test reads an older version of the game from the history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Keep the downloaded browsers between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install the browser (Chromium for the phone, WebKit, the engine in Safari, for the iPad)
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the tests
        run: npx playwright test ${{ matrix.args }}
        env:
          CI: true
      - name: Save the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ strategy.job-index }}
          path: tests/playwright-report
          retention-days: 14

  # One check named "test" that passes only if every job above passed (a rule that requires "test" keeps working)
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        run: |
          echo "Test jobs: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"

  publish:
    # runs only for main, and only when every test passed
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version stamp below reads the history
      - name: Gather the game's files (everything except the tests and the map-building tools)
        run: rsync -a --exclude .git --exclude .github --exclude tests --exclude tools ./ _site/
      - name: Stamp the version
        # WGQ_BUILD in index.html becomes the time of the last change to the game itself (not to tests, tools or notes),
        # so devices are offered an update only when the game changed
        run: |
          stamp=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd -- . ':!tests' ':!tools' ':!.github' ':!*.md')
          sed -i "s/WGQ_BUILD='[^']*'/WGQ_BUILD='$stamp'/" _site/index.html
          grep -o "WGQ_BUILD='[^']*'" _site/index.html
          # ...and the offline copy gets a new name for each version, so every update arrives as one complete set of files
          # (old code never meets new styles), with no need to remember to change CACHE in sw.js by hand
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'wgq-$stamp'/" _site/sw.js
          grep -o "const CACHE = '[^']*'" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
